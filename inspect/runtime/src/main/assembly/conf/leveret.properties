# Leveret Inspect node configuration.
#
# Every key below is shown with the value the runtime applies when the key is absent. Uncomment a
# key to override it. A relative path is resolved against the installation home; the installation
# home itself is derived from the location of the application artifact and cannot be configured.
#
# Precedence, later wins: this file, environment variables, application -Dkey=value arguments, then
# JVM system properties. The environment-variable name of a key is its name uppercased with dots
# replaced by underscores, for example LEVERET_LOG_LEVEL.


#--------------------------------------------------------------------------------------------------
# DATABASE
#--------------------------------------------------------------------------------------------------

# Connection URL. Absent selects the embedded evaluation database. The provider token must be one of
# h2, sqlserver, oracle, postgresql; any other value stops startup.
#leveret.jdbc.url=


#--------------------------------------------------------------------------------------------------
# PATHS
#--------------------------------------------------------------------------------------------------

# Persistent node data. Created when absent and never cleared by startup.
#leveret.path.data=data

# Log directory.
#leveret.path.logs=logs

# Runtime scratch and local command directory. Cleaned at startup and at internal restart, so it
# must not hold anything you need to keep.
#leveret.path.temp=temp

# Web runtime directory.
#leveret.path.web=web


#--------------------------------------------------------------------------------------------------
# PROCESS JVM OPTIONS
#--------------------------------------------------------------------------------------------------

# Primary options of each process. Every option must be nonempty and start with '-'. Options the
# runtime requires for correct operation cannot be given a different value.
#leveret.search.javaOpts=-Xmx512m -Xms512m -XX:MaxDirectMemorySize=256m -XX:+HeapDumpOnOutOfMemoryError
#leveret.web.javaOpts=-Xmx512m -Xms128m -XX:+HeapDumpOnOutOfMemoryError
#leveret.ce.javaOpts=-Xmx512m -Xms128m -XX:+HeapDumpOnOutOfMemoryError

# Extra options appended after the primary options of the same process.
#leveret.search.javaAdditionalOpts=
#leveret.web.javaAdditionalOpts=
#leveret.ce.javaAdditionalOpts=


#--------------------------------------------------------------------------------------------------
# SEARCH
#--------------------------------------------------------------------------------------------------

# Address of the local search health interface used to gate startup.
#leveret.search.host=127.0.0.1
#leveret.search.port=9001


#--------------------------------------------------------------------------------------------------
# STOP BEHAVIOR
#--------------------------------------------------------------------------------------------------

# Grace period of each process, in milliseconds, before stopping is escalated. Must be an integer of
# at least 1.
#leveret.web.gracefulStopTimeOutInMs=240000
#leveret.ce.gracefulStopTimeOutInMs=21600000

# Enables the monitor's graceful-stop command watcher. The hard-stop watcher always runs.
#leveret.enableStopCommand=false


#--------------------------------------------------------------------------------------------------
# LOGGING
#--------------------------------------------------------------------------------------------------

# Global threshold. Accepted values are INFO, DEBUG and TRACE.
#leveret.log.level=INFO

# Per-process thresholds, each overriding the global value for its own process.
#leveret.log.level.app=INFO
#leveret.log.level.es=INFO
#leveret.log.level.web=INFO
#leveret.log.level.ce=INFO

# Forwards child log output to the monitor's standard output.
#leveret.log.console=false

# Emits one JSON record per event instead of the plain format.
#leveret.log.jsonOutput=false

# Rotation of the active log files. Accepted forms are time:<date-pattern>, size:<file-size> and
# none. With none, rotation is left to the operator.
#leveret.log.rollingPolicy=time:yyyy-MM-dd

# Retained periods for time rotation, or highest file number for size rotation.
#leveret.log.maxFiles=7
