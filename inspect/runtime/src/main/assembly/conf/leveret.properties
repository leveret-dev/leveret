# Leveret Inspect configuration.
#
# Every key below is shown with the value the runtime applies when the key is absent. Uncomment a
# key to override it. A relative path is resolved against the installation home; the installation
# home itself is derived from the location of the application artifact and cannot be configured.
#
# Precedence, later wins: this file, environment variables, application -Dkey=value arguments, then
# JVM system properties. The environment-variable name of a key is its name uppercased with dots
# replaced by underscores, for example LEVERET_LOG_LEVEL.


#--------------------------------------------------------------------------------------------------
# DATABASE
#--------------------------------------------------------------------------------------------------

# Connection URL. Absent selects the embedded evaluation database. The provider token must be one of
# h2, postgresql; any other value stops startup.
#leveret.jdbc.url=

# Credentials of the connection above. Both stay empty for the embedded database.
#leveret.jdbc.username=
#leveret.jdbc.password=

# Port of the embedded database server on the loopback interface. Setting this key selects the
# embedded database and makes leveret.jdbc.url ineffective; the startup log then states which URL is
# in effect. The embedded database stores its files under the data directory and is meant for
# evaluation and testing, never for production.
#leveret.embeddedDatabase.port=9092

# Maximum pooled connections. Accepted values are integers from 1 through 2147483647. Size this
# against concurrent web and compute demand; roughly 1.2 times the maximum HTTP worker count is a
# reasonable starting point.
#leveret.jdbc.maxActive=60

# Minimum idle pooled connections.
#leveret.jdbc.minIdle=10

# Connection acquisition timeout in milliseconds. A value of 0 means the finite 2147483647 ms
# sentinel, not an indefinite wait; any other value must be at least 250. Exhaustion surfaces as a
# failed acquisition after this timeout rather than as more connections than leveret.jdbc.maxActive.
#leveret.jdbc.maxWait=8000

# Idle connection retirement, keepalive interval, maximum connection lifetime, and validation
# timeout, all in milliseconds.
#leveret.jdbc.idleTimeout=600000
#leveret.jdbc.keepaliveTime=180000
#leveret.jdbc.maxLifetime=1800000
#leveret.jdbc.validationTimeout=5000

# Runs pending database migrations automatically at startup. Migrations are forward-only: there is no
# reverse migration, so take a backup before an upgrade.
#leveret.autoDatabaseUpgrade=false


#--------------------------------------------------------------------------------------------------
# PATHS
#--------------------------------------------------------------------------------------------------

# Persistent data. Created when absent and never cleared by startup.
#leveret.path.data=data

# Log directory.
#leveret.path.logs=logs

# Runtime scratch. Cleaned at startup, so it must not hold anything you need to keep.
#leveret.path.temp=temp

# Web runtime directory.
#leveret.path.web=web


#--------------------------------------------------------------------------------------------------
# LOGGING
#--------------------------------------------------------------------------------------------------

# Global threshold. Accepted values are INFO, DEBUG and TRACE.
#leveret.log.level=INFO

# Also writes every log record to standard output.
#leveret.log.console=false

# Emits one JSON record per event instead of the plain format.
#leveret.log.jsonOutput=false
